    <!-- Lightweight click-tracking: runs only after cookie consent; otherwise stores temp attribution in sessionStorage -->
    <script>
      (function(){
        function trackEvent(action, label){
          if(window.g4_tracking_enabled && window.gtag) {
            try { window.gtag('event', action, { event_category: 'CTA', event_label: label }); } catch(e){}
          } else {
            console.log('analytics:', action, label);
          }
        }

        function handleClick(id){
          try{
            var consent = localStorage.getItem('g4_cookie_consent');
            if(consent === 'accepted') {
              localStorage.setItem('g4_lead_source', id);
            } else {
              // store temporarily until user accepts cookies
              sessionStorage.setItem('g4_lead_source_temp', id);
            }
          }catch(e){}
          trackEvent('click_'+id, location.pathname + location.search);
        }

        function attachListeners(){
          var ids = ['hero-get-audit-cta','hero-explore-work-cta','contact-submit-btn','hero-explore-work-cta'];
          ids.forEach(function(id){
            var el = document.getElementById(id);
            if(!el) return;
            el.removeEventListener('click', el.__g4_handler__);
            el.__g4_handler__ = function(){ handleClick(id); };
            el.addEventListener('click', el.__g4_handler__);
          });
        }

        document.addEventListener('DOMContentLoaded', function(){
          attachListeners();
        });

        // When consent is granted by the CookieConsent component, it should dispatch this event
        window.addEventListener('g4-cookie-consent', function(e){
          try{
            var consent = localStorage.getItem('g4_cookie_consent');
            if(consent === 'accepted'){
              // migrate any temp attribution
              var temp = sessionStorage.getItem('g4_lead_source_temp');
              if(temp) { localStorage.setItem('g4_lead_source', temp); sessionStorage.removeItem('g4_lead_source_temp'); }
              // flag tracking enabled so other scripts can use it
              window.g4_tracking_enabled = true;
            }
          }catch(e){}
        });
      })();
    </script>
